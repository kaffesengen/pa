<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panorama Arena – Sal 2. etg</title>

  <script>
    setInterval(() => location.reload(), 5 * 60 * 1000);
  </script>

  <style>
    body{
      margin:0;
      height:100vh;
      background:#0b0f14;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#fff;
      display:flex;
      flex-direction:column;
    }

    header{
      padding: 1.1rem 2rem;
      background: linear-gradient(90deg, #141e30, #243b55);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 18px;
    }

    header .title{
      font-size: 2rem;
      font-weight: 520;
      letter-spacing: 0.35px;
      white-space: nowrap;
    }

    header{
  padding: 1.1rem 2rem;
  background: linear-gradient(90deg, #141e30, #243b55);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 18px;
}

/* Diskret tilbakeknapp */
.back{
  flex: 0 0 auto;
  display:inline-flex;
  align-items:center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 999px;
  text-decoration: none;
  color: rgba(255,255,255,0.92);

  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.16);
  box-shadow: 0 10px 30px rgba(0,0,0,0.22);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  opacity: 0.72;
  transition: opacity .16s ease, transform .16s ease, background .16s ease;
  user-select: none;
}

.back:hover{
  opacity: 0.95;
  transform: translateY(-1px);
  background: rgba(255,255,255,0.14);
}

.back svg{
  width: 18px;
  height: 18px;
  opacity: 0.95;
}

/* Tekst kan skjules på smalere skjermer */
.back span{
  font-size: 0.95rem;
  letter-spacing: 0.2px;
}

/* Tittel sentrert “app”-følelse */
header .title{
  font-size: 2rem;
  font-weight: 520;
  letter-spacing: 0.35px;
  white-space: nowrap;
}

/* På smale skjermer: skjul teksten, behold pil */
@media (max-width: 900px){
  header .title{ font-size: 1.6rem; }
  .back span{ display:none; }
}

    
    .latest-wrap{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      min-width: 320px;
      max-width: 60vw;
    }

    .latest-pill{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 10px 30px rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      width: 100%;
      overflow: hidden;
    }

    .latest-badge{
      flex: 0 0 auto;
      font-size: 0.9rem;
      opacity: 0.9;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      line-height: 1;
      white-space: nowrap;
    }

    .latest-text{
      font-size: 1.05rem;
      opacity: 0.95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .latest-new{
      flex: 0 0 auto;
      margin-left: 2px;
      font-weight: 760;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 999px;
      color: #b9f5d0;
      background: rgba(64, 160, 120, 0.22);
      border: 1px solid rgba(140, 220, 180, 0.45);
      animation: latestPing 1.6s ease-in-out infinite;
      line-height: 1;
      white-space: nowrap;
    }

    @keyframes latestPing{
      0%, 100% { opacity: 0.35; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1px); }
    }

    .is-hidden{ display:none; }

    .frame-wrapper{
      flex:1;
      padding: 1.25rem;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      border-radius: 18px;
      background:#000;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    @media (max-width: 900px){
      header .title{ font-size: 1.6rem; }
      .latest-wrap{ min-width: 0; max-width: 62vw; }
      .latest-text{ font-size: 0.98rem; }
    }
  </style>
</head>
<body>

  <header>
  <a class="back" href="../index.html" aria-label="Tilbake til oversikt" title="Tilbake">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>
    <span>Tilbake</span>
  </a>

  <div class="title">Panorama Arena – Sal 2. etg</div>

  <div class="latest-wrap" aria-label="Siste melding">
    <div id="latestPill" class="latest-pill is-hidden">
      <span id="latestBadge" class="latest-badge">INFO</span>
      <span id="latestText" class="latest-text">Siste melding …</span>
      <span id="latestNew" class="latest-new is-hidden">NY</span>
    </div>
  </div>
</header>


  <div class="frame-wrapper">
    <iframe
      src="https://teamup.com/ksqn9dtm67gsfz73fw?tz=Calendar%20default&showHeader=0&showLogo=0&showSearch=0&showProfileAndInfo=0&disableSidepanel=1&showTitle=0&showViewSelector=0&showMenu=0&showViewHeader=1&showAgendaDetails=0&showDateControls=0&showDateRange=0"
      loading="lazy"
      referrerpolicy="no-referrer"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const NEW_WINDOW_MS = 72 * 60 * 60 * 1000; // 72t

    async function loadLatest(){
      try{
        const res = await fetch("../feed.json?ts=" + Date.now(), { cache: "no-store" });
        if(!res.ok) throw new Error("feed.json " + res.status);

        const data = await res.json();
        const item = (data.items && data.items.length) ? data.items[0] : null;

        const pill  = document.getElementById("latestPill");
        const badge = document.getElementById("latestBadge");
        const text  = document.getElementById("latestText");
        const newEl = document.getElementById("latestNew");

        if(!item){
          pill.classList.add("is-hidden");
          return;
        }

        const createdAtMs = item.createdAt ? Date.parse(item.createdAt) : 0;
        if(!createdAtMs){
          pill.classList.add("is-hidden");
          return;
        }

        const age = Date.now() - createdAtMs;

        // 72t varighet på kalendersider
        if(age > NEW_WINDOW_MS){
          pill.classList.add("is-hidden");
          return;
        }

        const kind = String(item.kind || "INFO").toUpperCase();
        badge.textContent = kind;
        text.textContent = item.text || "";

        newEl.classList.toggle("is-hidden", !(age <= NEW_WINDOW_MS));

        pill.classList.remove("is-hidden");
      }catch(e){
        console.error(e);
        const pill = document.getElementById("latestPill");
        if(pill) pill.classList.add("is-hidden");
      }
    }

    loadLatest();
    setInterval(loadLatest, 10_000);
  </script>

</body>
</html>
