<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panorama Arena</title>

  <style>
    :root{
      --bg1:#0f2027;
      --bg2:#203a43;
      --bg3:#2c5364;
      --glass: rgba(255,255,255,0.12);
      --glass2: rgba(255,255,255,0.18);
      --border: rgba(255,255,255,0.14);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      color: white;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: min(1100px, 92vw);
      text-align: center;
      padding: 48px 0;
    }

    h1 {
      font-size: clamp(2.2rem, 3.6vw, 3.2rem);
      font-weight: 650;
      margin: 0 0 10px 0;
      letter-spacing: 0.4px;
    }

    .subtitle{
      margin: 0 0 22px 0;
      opacity: 0.75;
      font-size: 1.05rem;
    }

    .buttons {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn {
      text-decoration: none;
      padding: 18px 34px;
      border-radius: 16px;
      background: var(--glass);
      color: white;
      font-size: 1.25rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      border: 1px solid var(--border);
    }

    .btn:hover {
      background: var(--glass2);
      transform: translateY(-3px);
      box-shadow: 0 18px 55px rgba(0,0,0,0.35);
    }

    /* Viktige meldinger (feed) */
    .notice{
      width: min(980px, 92vw);
      margin: 14px auto 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 18px 55px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      text-align: left;
    }

    .notice-title{
      padding: 14px 18px;
      font-weight: 650;
      letter-spacing: 0.3px;
      background: rgba(0,0,0,0.18);
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .notice-list{
      padding: 14px 18px;
      display: grid;
      gap: 10px;
      font-size: 1.15rem;
      min-height: 24px;
    }

    .notice-item{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .notice-badge{
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 2px;
    }

    .notice-text{
      line-height: 1.25;
    }

    .notice-meta{
      opacity:.65;
      font-size:.9rem;
      margin-top:2px;
    }

    /* Slideshow frame */
    .slideshow {
      margin: 0 auto;
      width: min(980px, 92vw);
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 22px 70px rgba(0,0,0,0.55);
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.22);
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 900ms ease, transform 4500ms ease;
      will-change: opacity, transform;
      filter: saturate(1.05) contrast(1.02);
    }

    .slide.is-active {
      opacity: 1;
      transform: scale(1.08);
    }

    .slideshow::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.30));
      pointer-events:none;
    }

    .hint {
      margin-top: 14px;
      opacity: 0.70;
      font-size: 0.95rem;
    }

    @media (min-width: 1400px){
      .container{ width: min(1300px, 92vw); }
      .slideshow{ width: min(1120px, 92vw); }
      .notice{ width: min(1120px, 92vw); }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Panorama Arena – Hallen</h1>
    <p class="subtitle">Kalenderoversikt</p>

    <div class="buttons">
      <a class="btn" href="kalendere/hallen.html">Hallen</a>
      <a class="btn" href="kalendere/sal2etg.html">Sal 2. etg</a>
    </div>

    <section class="notice" aria-label="Viktige meldinger">
      <div class="notice-title">Viktige meldinger</div>
      <div id="noticeList" class="notice-list">Laster meldinger …</div>
    </section>

    <div class="slideshow" id="slideshow" aria-label="Bilder fra Panorama Arena">
      <div class="slide is-active"></div>
      <div class="slide"></div>
    </div>

    <div class="hint">Trykk på ønsket kalender.</div>
  </div>

  <script>
    // ---- FEED (leser feed.json) ----
    async function loadFeed(){
      try{
        const res = await fetch("feed.json?ts=" + Date.now(), { cache: "no-store" });
        if(!res.ok) throw new Error("feed.json " + res.status);

        const data = await res.json();
        const el = document.getElementById("noticeList");
        const items = (data.items || []).slice(0, 6);

        if(items.length === 0){
          el.textContent = "Ingen meldinger akkurat nå.";
          return;
        }

        el.innerHTML = items.map(it => {
          const kind = (it.kind || "INFO").toUpperCase();
          const when = it.createdAt ? new Date(it.createdAt).toLocaleString("no-NO") : "";
          return `
            <div class="notice-item">
              <div class="notice-badge">${escapeHtml(kind)}</div>
              <div class="notice-text">
                ${escapeHtml(it.text || "")}
                ${when ? `<div class="notice-meta">${escapeHtml(when)}</div>` : ``}
              </div>
            </div>
          `;
        }).join("");
      }catch(e){
        console.error(e);
        const el = document.getElementById("noticeList");
        if (el) el.textContent = "Kunne ikke laste meldinger (sjekk feed.json).";
      }
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[m]));
    }

    loadFeed();
    setInterval(loadFeed, 10_000); // hver 10. sekund


    // ---- SLIDESHOW ----
    const images = [
      "assets/slideshow/pa1.webp",
      "assets/slideshow/pa2.webp",
      "assets/slideshow/pa3.webp",
      "assets/slideshow/pa4.webp",
      "assets/slideshow/pa5.webp",
      "assets/slideshow/pa6.webp",
      "assets/slideshow/pa7.webp",
      "assets/slideshow/pa8.webp"
    ];

    const slides = Array.from(document.querySelectorAll("#slideshow .slide"));
    let i = 0;
    let front = 0;

    function setSlide(el, url) {
      el.style.backgroundImage = `url("${url}")`;
    }

    // Preload for å unngå blink
    images.forEach(src => { const img = new Image(); img.src = src; });

    setSlide(slides[0], images[0]);
    setSlide(slides[1], images[1 % images.length]);

    const intervalMs = 6500;

    setInterval(() => {
      const back = 1 - front;
      i = (i + 1) % images.length;

      setSlide(slides[back], images[i]);
      slides[back].classList.add("is-active");
      slides[front].classList.remove("is-active");

      front = back;
    }, intervalMs);
  </script>
</body>
</html>
