<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panorama Arena</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141e30">
  
  <!-- iOS "app mode" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panorama Arena">

  
  <style>
    :root{
      --bg1:#0f2027;
      --bg2:#203a43;
      --bg3:#2c5364;
      --glass: rgba(255,255,255,0.12);
      --glass2: rgba(255,255,255,0.18);
      --border: rgba(255,255,255,0.14);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      color: white;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: min(1100px, 92vw);
      text-align: center;
      padding: 48px 0;
    }

    /* Top bar: title + login button */
    .topbar{
      width: min(980px, 92vw);
      margin: 0 auto 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
    }

    h1 {
      font-size: clamp(2.2rem, 3.6vw, 3.2rem);
      font-weight: 650;
      margin: 0;
      letter-spacing: 0.4px;
      text-align:left;
    }

    .subtitle{
      width: min(980px, 92vw);
      margin: 8px auto 18px;
      opacity: 0.75;
      font-size: 1.05rem;
      text-align:left;
    }

    .buttons {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn {
      text-decoration: none;
      padding: 18px 34px;
      border-radius: 16px;
      background: var(--glass);
      color: white;
      font-size: 1.25rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .btn:hover {
      background: var(--glass2);
      transform: translateY(-3px);
      box-shadow: 0 18px 55px rgba(0,0,0,0.35);
    }

    .btn.small{
      padding: 14px 20px;
      font-size: 1rem;
      border-radius: 14px;
      margin-left: auto;
      white-space: nowrap;
    }

    /* Feed */
    .notice{
      width: min(980px, 92vw);
      margin: 14px auto 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 18px 55px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      text-align: left;
    }

    .notice-title{
      padding: 14px 18px;
      font-weight: 650;
      letter-spacing: 0.3px;
      background: rgba(0,0,0,0.18);
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .notice-list{
      padding: 14px 18px;
      display: grid;
      gap: 10px;
      font-size: 1.15rem;
      min-height: 24px;
    }

    .notice-item{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

        /* Pending delete: behold linjen, men tone den ned */
    .notice-item.is-deleting{
      opacity: 0.45;
    }
    
    .notice-item.is-deleting .notice-text{
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(255,255,255,0.55);
    }
    
    .notice-item.is-deleting .notice-badge{
      opacity: 0.65;
    }
    
    .notice-item.is-deleting .notice-delete{
      opacity: 0.6;
      pointer-events: none;
    }

    
    .notice-badge{
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 2px;
      position: relative;
      line-height: 1;
      white-space: nowrap;
    }

    .notice-text{
      line-height: 1.25;
      flex: 1 1 auto;
      min-width: 0;
    }

    .notice-meta{
      opacity:.65;
      font-size:.9rem;
      margin-top:2px;
    }

    /* Ny-indikator (<=72t) */
    .notice-item.is-new .notice-badge::after{
      content: "!";
      margin-left: 8px;
      display: inline-flex;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;

      /* Myk “ny info”-grønn */
      color: #b9f5d0;
      background: rgba(64, 160, 120, 0.22);
      border: 1px solid rgba(140, 220, 180, 0.45);

      animation: pingFade 1.4s ease-in-out infinite;
      font-weight: 800;
    }

    /* Subtil blink/fade på INFO for nye meldinger */
    .notice-item.is-new.is-info{
      animation: infoPulse 2.8s ease-in-out infinite;
    }

    @keyframes infoPulse{
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
    }

    @keyframes pingFade{
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* Delete (only when logged in) */
    .notice-delete{
      margin-left: 10px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 34px;
      border-radius: 12px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
      color: rgba(255,255,255,0.92);
    }

    .notice-delete:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.16);
    }

    .notice-delete svg{
      width: 18px;
      height: 18px;
      opacity: 0.9;
    }

    /* Slideshow */
    .slideshow {
      margin: 0 auto;
      width: min(980px, 92vw);
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 22px 70px rgba(0,0,0,0.55);
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.22);
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 900ms ease, transform 4500ms ease;
      will-change: opacity, transform;
      filter: saturate(1.05) contrast(1.02);
    }

    .slide.is-active {
      opacity: 1;
      transform: scale(1.08);
    }

    .slideshow::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.30));
      pointer-events:none;
    }

    .hint {
      margin-top: 14px;
      opacity: 0.70;
      font-size: 0.95rem;
    }

    @media (min-width: 1400px){
      .container{ width: min(1300px, 92vw); }
      .slideshow{ width: min(1120px, 92vw); }
      .notice{ width: min(1120px, 92vw); }
      .topbar, .subtitle{ width: min(1120px, 92vw); }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="topbar">
      <h1>Panorama Arena – Hallen</h1>
      <button class="btn small" id="loginBtn" type="button">Login</button>
    </div>
    <p class="subtitle">Kalenderoversikt</p>

    <div class="buttons">
      <a class="btn" href="kalendere/hallen.html">Hallen</a>
      <a class="btn" href="kalendere/sal2etg.html">Sal 2. etg</a>
    </div>

    <section class="notice" aria-label="Viktige meldinger">
      <div class="notice-title">Viktige meldinger</div>
      <div id="noticeList" class="notice-list">Laster meldinger …</div>
    </section>

    <div class="slideshow" id="slideshow" aria-label="Bilder fra Panorama Arena">
      <div class="slide is-active"></div>
      <div class="slide"></div>
    </div>

    <div class="hint">Trykk på ønsket kalender.</div>
  </div>

  <script>
    // -------------------- CONFIG --------------------
    const ADMIN_API_BASE = "https://pa-telegram-bot-xh0y.onrender.com";
    const MAX_SHOW = 5;
    const NEW_WINDOW_MS = 72 * 60 * 60 * 1000; // 72 timer

    // Stored only in this browser tab session
    let adminAuth = sessionStorage.getItem("adminAuth") || "";

    // -------------------- PENDING DELETE --------------------
    // Id-er som er "pending delete" (behold strikethrough mellom polls)
    const deletingIds = new Set(JSON.parse(sessionStorage.getItem("deletingIds") || "[]"));
  
    function saveDeletingIds(){
      sessionStorage.setItem("deletingIds", JSON.stringify(Array.from(deletingIds)));
    }
    // -------------------- HELPERS --------------------
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[m]));
    }

    function fmtNo(d){
      try { return new Date(d).toLocaleString("no-NO"); }
      catch { return ""; }
    }

    // -------------------- LOGIN --------------------
    document.getElementById("loginBtn")?.addEventListener("click", async () => {
      // If already logged in, clicking again logs out (simple UX for kiosk admin use)
      if (adminAuth) {
        const ok = confirm("Logge ut?");
        if (!ok) return;
        adminAuth = "";
        sessionStorage.removeItem("adminAuth");
        await loadFeed();
        return;
      }

      const u = prompt("Brukernavn:");
      if (u === null) return;

      const p = prompt("Passord:");
      if (p === null) return;

      const candidate = "Basic " + btoa(`${u}:${p}`);

// Verifiser mot server før vi “logger inn” i UI
const ping = await fetch(`${ADMIN_API_BASE}/admin/ping`, {
  method: "GET",
  headers: { "Authorization": candidate }
});

if (!ping.ok) {
  alert("Feil brukernavn eller passord.");
  return;
}

adminAuth = candidate;
sessionStorage.setItem("adminAuth", adminAuth);
await loadFeed();

    });

    function updateLoginButton(){
      const btn = document.getElementById("loginBtn");
      if (!btn) return;
      btn.textContent = adminAuth ? "Logout" : "Login";
    }

    // -------------------- FEED --------------------
    async function deleteItem(id){
      const res = await fetch(`${ADMIN_API_BASE}/admin/items/${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: { "Authorization": adminAuth }
      });
      return res.ok;
    }

    async function loadFeed(){
      updateLoginButton();
      const el = document.getElementById("noticeList");

      try{
        const res = await fetch("feed.json?ts=" + Date.now(), { cache: "no-store" });
        if(!res.ok) throw new Error("feed.json " + res.status);

        const data = await res.json();
        const items = (data.items || []).slice(0, MAX_SHOW);
        const idsInFeed = new Set(items.map(x => String(x.id || "")).filter(Boolean));
        let changed = false;
        for (const id of Array.from(deletingIds)) {
          if (!idsInFeed.has(id)) { deletingIds.delete(id); changed = true; }
        }
        if (changed) saveDeletingIds();

        const now = Date.now();

        if(items.length === 0){
          el.textContent = "Ingen meldinger akkurat nå.";
          return;
        }

        const showDelete = !!adminAuth;

        el.innerHTML = items.map(it => {
          const kind = (it.kind || "INFO").toUpperCase();
          const createdAtMs = it.createdAt ? Date.parse(it.createdAt) : 0;
          const isNew = createdAtMs && (now - createdAtMs) <= NEW_WINDOW_MS;
          const isInfo = kind === "INFO";
          const when = it.createdAt ? fmtNo(it.createdAt) : "";

          const isDeleting = it.id && deletingIds.has(String(it.id));

          const classes = [
            "notice-item",
            isNew ? "is-new" : "",
            isInfo ? "is-info" : "",
            isDeleting ? "is-deleting" : ""
          ].filter(Boolean).join(" ");


          // NOTE: id is required for delete to work
          const idAttr = it.id ? String(it.id) : "";

          return `
            <div class="${classes}">
              <div class="notice-badge">${escapeHtml(kind)}</div>
              <div class="notice-text">
                ${escapeHtml(it.text || "")}
                ${when ? `<div class="notice-meta">${escapeHtml(when)}</div>` : ``}
              </div>

              ${showDelete && idAttr ? `
                <button class="notice-delete" title="Slett" data-id="${escapeHtml(idAttr)}" aria-label="Slett">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M6 6l1 16h10l1-16"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                  </svg>
                </button>
              ` : ``}
            </div>
          `;
        }).join("");

        // Wire delete handlers
        if (adminAuth) {
          document.querySelectorAll(".notice-delete").forEach(btn => {
            btn.addEventListener("click", async () => {
              const id = btn.getAttribute("data-id");
              if (!id) return;

              const ok = confirm("Slette denne meldingen?");
              if (!ok) return;

              // Optimistisk: skjul linjen med én gang
              // Markér som "pending delete" før vi kaller API
              deletingIds.add(String(id));
              saveDeletingIds();
              
              // Vis strikethrough + nedtoning med en gang
              const row = btn.closest(".notice-item");
              if (row) row.classList.add("is-deleting");
              
              const success = await deleteItem(id);
              if (!success) {
                // Rull tilbake hvis sletting feiler
                deletingIds.delete(String(id));
                saveDeletingIds();
                if (row) row.classList.remove("is-deleting");
              
                alert("Kunne ikke slette. Sjekk login (admin/pass) og at boten kjører.");
                return;
              }
              
              // IKKE fjern raden her.
              // Den forsvinner automatisk når feed.json faktisk er oppdatert.
              // Trigger en ekstra refresh litt senere for raskere sync:
              setTimeout(loadFeed, 1200);


            });
          });
        }

      }catch(e){
        console.error(e);
        el.innerHTML = `
          <div class="notice-item">
            <div class="notice-badge">FEIL</div>
            <div class="notice-text">
              Kunne ikke laste <b>feed.json</b>.
              <div class="notice-meta">
                Sjekk at <b>feed.json</b> ligger i repo-root og er committed.
              </div>
            </div>
          </div>
        `;
      }
    }

    loadFeed();
    setInterval(loadFeed, 10_000); // hver 10. sekund


    // -------------------- SLIDESHOW --------------------
    const images = [
      "assets/slideshow/pa1.webp",
      "assets/slideshow/pa2.webp",
      "assets/slideshow/pa3.webp",
      "assets/slideshow/pa4.webp",
      "assets/slideshow/pa5.webp",
      "assets/slideshow/pa6.webp",
      "assets/slideshow/pa7.webp",
      "assets/slideshow/pa8.webp"
    ];

    const slides = Array.from(document.querySelectorAll("#slideshow .slide"));
    let i = 0;
    let front = 0;

    function setSlide(el, url) {
      el.style.backgroundImage = `url("${url}")`;
    }

    // Preload to avoid flashing
    images.forEach(src => { const img = new Image(); img.src = src; });

    setSlide(slides[0], images[0]);
    setSlide(slides[1], images[1 % images.length]);

    const intervalMs = 6500;

    setInterval(() => {
      const back = 1 - front;
      i = (i + 1) % images.length;

      setSlide(slides[back], images[i]);
      slides[back].classList.add("is-active");
      slides[front].classList.remove("is-active");

      front = back;
    }, intervalMs);
  </script>
</body>
</html>
